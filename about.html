<!doctype html>
<html lang="en">
  <head>
    <title>About Me | Kayla Kim</title>
    <meta
      name="description"
      content="Get to know me and work with me in the future!"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/branding-images/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/branding-images/favicon.png"
    />
    <meta property="og:image" content="screenshot.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body class="about-page">
    <!-- Shared header -->
    <div id="header-placeholder"></div>
    <ul class="about-grid">
      <li class="about-grid-image">
        <figure class="about-image">
          <img
            src="assets/self-portrait/self-portrait-kayla-kim-first-year.jpg"
            width="1500"
            height="1500"
            alt="Kayla Oil Painting"
          />
        </figure>
      </li>
      <li class="about-grid-text">
        <div class="about-me-title">
          <h1>About Me</h1>
        </div>
        <ul class="about-me-tags">
          <li>She/Her</li>
          <li>Coquitlam, BC</li>
        </ul>
        <p>
          Hello! I'm Kayla Kim, I like horror and coffee! If you don't see me
          creating designs and illustrations, then you'll probably catch me
          streaming and playing games on my spare time.
        </p>
        <p>My favourite games are...</p>
      </li>
    </ul>
    <!-- Shared footer -->
    <div id="footer-placeholder"></div>

    <!-- Shared header and footer -->
    <script>
      fetch("includes/header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header-placeholder").innerHTML = data;
        });

      fetch("includes/footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data;
          document.getElementById("copyright-years").textContent +=
            new Date().getFullYear();
        });
    </script>

    <!-- Bottom menu -->
    <div id="bottomMenu" class="bottomMenu hide">
      <a href="#">Back to top</a>
    </div>

    <script src="./js/bottom-menu.js" defer></script>
  </body>
</html>
